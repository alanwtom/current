name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install libtorrent
        run: brew install libtorrent-rasterbar

      - name: Check function complexity
        run: |
          brew install swiftlint
          swiftlint lint --only-rule cyclomatic_complexity --strict Sources

      - name: Build (debug)
        run: swift build

      - name: Check release scripts
        run: |
          zsh -n Scripts/make-app.sh Scripts/release.sh Scripts/test-update.sh
          plutil -lint Scripts/Info.plist
          python3 Scripts/test-release-version.py

      - name: Run tests
        run: swift test

      - name: Build release bundle
        run: Scripts/make-app.sh --release

      # 90 s, not 6 s. The layout-churn crash class described in AGENTS.md
      # takes 10-35 s to show up, so a six second launch proved nothing about
      # the exact failure that has killed this app twice.
      #
      # Caveat worth knowing: that crash needs the main window to actually lay
      # out, and a CI runner may not give the app a window server. So a pass
      # here is weaker evidence than a soak on a real Mac — it catches crashes
      # and hangs, it does not prove the window is healthy. Soak locally too.
      - name: Soak launch (simulate mode)
        run: |
          BEFORE=$(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -ci current || true)
          .build/Current.app/Contents/MacOS/Current -simulate &
          APP_PID=$!
          for i in $(seq 1 18); do
            sleep 5
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "::error::App exited after ~$((i * 5))s — expected it to stay up for 90s"
              exit 1
            fi
          done
          kill $APP_PID
          sleep 2
          AFTER=$(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -ci current || true)
          if [ "$AFTER" -ne "$BEFORE" ]; then
            echo "::error::New crash report(s) written during the soak ($BEFORE -> $AFTER)"
            ls -t ~/Library/Logs/DiagnosticReports/ | grep -i current | head -3
            exit 1
          fi
          echo "Survived 90s with no new crash reports."
